:root{
  --navy:#01337C; --navy-700:#0b4aa3; --navy-900:#022463;
  --gold:#FFB522; --gold-soft:#fff0cc;
  --ink:#1d1d1f; --muted:#6e6e73; --line:#e4e4ea; --line-2:#eeeef2;
  --bg:#f5f5f7; --card:#ffffff;
  --green:#1f9d68; --green-soft:#e6f5ee;
  --amber:#c8860f; --amber-soft:#fbefd6;
  --red:#d4543f; --red-soft:#fbe8e4;
  --blue:#3685FE; --blue-soft:#e8f0ff;
  --t-fech:#1f9d68; --t-q:#c64a35; --t-m:#d3881f; --t-f:#3461bb;
  --r:18px; --r-sm:12px;
  --sh:0 1px 2px rgba(0,0,0,.045);
  --sh-lg:0 8px 30px -14px rgba(2,36,99,.30);
  font-synthesis-weight:none;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:"Poppins",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;font-size:14px;line-height:1.5;letter-spacing:-.01em}
h1,h2,h3,h4{margin:0;font-weight:600;letter-spacing:-.022em}
button{font-family:inherit;cursor:pointer}
input,select{font-family:inherit;font-size:13px}
:focus-visible{outline:2px solid var(--navy);outline-offset:2px}

/* ---------- Layout ---------- */
.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
.sidebar{background:#fbfbfd;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;overflow:hidden;border-right:1px solid var(--line)}
.brand{padding:20px 18px 16px;display:flex;flex-direction:column;gap:6px;border-bottom:1px solid var(--line-2)}
.brand-logo{width:100%;max-width:200px;height:auto;display:block}
.brand .bs{font-size:11px;color:var(--muted);font-weight:500;letter-spacing:.2px}
.nav{padding:12px;flex:1;overflow-y:auto}
.nav .grp{font-size:11px;color:#86868b;margin:16px 12px 6px;font-weight:600}
.nav a{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:10px;color:#3c3c43;text-decoration:none;font-size:13.5px;font-weight:500;margin-bottom:2px;transition:.14s;cursor:pointer}
.nav a svg{width:18px;height:18px;flex:none;opacity:.6}
.nav a:hover{background:rgba(0,0,0,.045);color:var(--ink)}
.nav a.on{background:rgba(32,57,109,.09);color:var(--navy);font-weight:600}
.nav a.on svg{opacity:1}
.side-foot{padding:14px 18px;border-top:1px solid var(--line-2);font-size:11px;color:#86868b;line-height:1.6}
.main{display:flex;flex-direction:column;min-width:0}
.topbar{background:rgba(255,255,255,.8);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--line);
  padding:0 28px;height:60px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:20}
.topbar h1{font-size:19px;font-weight:600}
.topbar .crumb{font-size:11.5px;color:var(--muted);font-weight:500;margin-bottom:1px}
.spacer{flex:1}
.cycle-tag{display:flex;align-items:center;gap:8px;background:var(--navy);color:#fff;padding:7px 13px;border-radius:980px;font-size:12.5px;font-weight:600;white-space:nowrap}
.cycle-tag .c2{color:var(--gold)}
.base-tag{font-size:11.5px;color:var(--muted);text-align:right;line-height:1.35;white-space:nowrap}
.base-tag b{color:var(--ink);font-weight:600}
.content{padding:26px 32px 60px;width:100%;max-width:min(1880px,96vw);margin:0 auto}

/* ---------- Buttons / chips ---------- */
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:#fff;color:var(--ink);padding:9px 16px;border-radius:980px;font-size:13px;font-weight:500;transition:.14s}
.btn:hover{background:#f5f5f7;border-color:#d8d8de}
.btn svg{width:16px;height:16px}
.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.primary:hover{background:var(--navy-700)}
.btn.sm{padding:6px 13px;font-size:12px}
.chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{border:1px solid var(--line);background:#fff;padding:6px 13px;border-radius:980px;font-size:12px;font-weight:500;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.chip .sw{width:9px;height:9px;border-radius:50%}
.chip.t-off{opacity:.55;text-decoration:line-through}
.search{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:980px;padding:7px 14px;background:#fff;min-width:250px}
.search input{border:none;outline:none;flex:1;font-size:13px;background:transparent}
.search svg{width:15px;height:15px;color:var(--muted)}
.sel{border:1px solid var(--line);border-radius:980px;padding:7px 13px;font-size:12.5px;background:#fff;color:var(--ink);height:36px;max-width:300px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:980px;overflow:hidden;background:#fff}
.seg button{border:none;background:transparent;padding:7px 14px;font-size:12px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--navy);color:#fff}
.lbl-mini{font-size:11px;color:var(--muted);font-weight:600;margin-right:2px}

/* ---------- Cards / KPIs ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.card .hd{padding:16px 20px;border-bottom:1px solid var(--line-2);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.card .hd h3{font-size:15px;font-weight:600}
.card .hd .sub{font-size:12px;color:var(--muted)}
.card .bd{padding:20px}
.section-title{display:flex;align-items:center;gap:12px;margin:28px 0 14px}
.section-title .ix{font-size:11px;font-weight:600;color:#b07d0a;text-transform:uppercase}
.section-title h2{font-size:17px;font-weight:600;color:var(--navy-900)}
.section-title .ln{flex:1;height:1px;background:var(--line)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--sh)}
.kpi .lbl{font-size:12.5px;color:var(--muted);font-weight:500}
.kpi .val{font-size:27px;font-weight:600;letter-spacing:-.03em;margin-top:8px;color:var(--navy-900)}
.kpi .meta{font-size:12px;color:var(--muted);margin-top:5px}
.hero{grid-column:span 2;background:var(--navy);color:#fff;border-radius:var(--r);padding:24px 26px;position:relative;overflow:hidden;box-shadow:var(--sh-lg)}
.hero::after{content:"";position:absolute;right:-70px;top:-70px;width:230px;height:230px;border-radius:50%;background:radial-gradient(circle,rgba(249,179,42,.16),transparent 70%)}
.hero .lbl{color:#a9b7d8;font-size:12.5px;font-weight:500}
.hero .big{font-size:36px;font-weight:600;letter-spacing:-.03em;margin-top:6px}
.hero .sub{color:#c3cfe8;font-size:13px;margin-top:5px}
.hero .pct{position:absolute;top:24px;right:26px;text-align:right;z-index:1}
.hero .pct .n{font-size:31px;font-weight:600;color:var(--gold)}
.hero .pct .t{font-size:11.5px;color:#a9b7d8;font-weight:500}
.progress{height:10px;background:rgba(255,255,255,.16);border-radius:980px;margin-top:18px;overflow:hidden}
.progress>i{display:block;height:100%;border-radius:980px;background:var(--gold);transition:width .8s cubic-bezier(.22,1,.36,1)}
.scen{display:flex;gap:18px;flex-wrap:wrap;align-items:center;padding:14px 20px}
.scen .grpx{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.scen input[type=number]{width:62px;border:1px solid var(--line);border-radius:9px;padding:6px 8px;text-align:right}

/* ---------- Tabelas ---------- */
table{width:100%;border-collapse:collapse}
thead th{font-size:11px;color:var(--muted);font-weight:500;text-align:left;padding:11px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:#fff;cursor:pointer;user-select:none}
thead th.sorted{color:var(--navy);font-weight:600}
thead th .ar{font-size:9px;margin-left:3px}
tbody td{padding:10px 12px;border-bottom:1px solid var(--line-2);font-size:13px;vertical-align:middle}
tbody tr:hover{background:#fafafc}
tbody tr.click{cursor:pointer}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tfoot td{font-weight:600;background:#f9f9fb;border-top:1px solid var(--line);padding:11px 12px;font-size:13px}
.tbl-scroll{overflow:auto;max-height:70vh}
.tbl-scroll thead th{position:sticky;top:0;z-index:2}
.tbl-scroll tfoot td{position:sticky;bottom:0;z-index:2}
.cod{font-variant-numeric:tabular-nums;color:var(--muted);font-size:12px}
.itn{font-weight:500}
.prg{font-size:11.5px;color:var(--muted);max-width:280px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.falta{color:var(--red);font-weight:600}
.ok{color:var(--green);font-weight:600}
.inbar{height:7px;border-radius:5px;background:var(--line);overflow:hidden;min-width:70px}
.inbar>i{display:block;height:100%;border-radius:5px}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px;white-space:nowrap}
.badge.g{background:var(--green-soft);color:var(--green)}
.badge.b{background:var(--blue-soft);color:#2b56a8}
.badge.a{background:var(--amber-soft);color:#9a6a09}
.badge.gr{background:#eef0f5;color:var(--muted)}
.badge.r{background:var(--red-soft);color:var(--red)}
.tb{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;white-space:nowrap}
.tb i{width:8px;height:8px;border-radius:50%;display:inline-block}

/* ---------- Barras ---------- */
.hbars{display:flex;flex-direction:column;gap:9px}
.hb{display:grid;grid-template-columns:minmax(150px,300px) 1fr 90px;gap:12px;align-items:center;font-size:12.5px}
.hb .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb .nm small{color:var(--muted);font-size:11px;margin-right:4px}
.hb .tr{height:18px;background:var(--line-2);border-radius:6px;overflow:hidden;display:flex}
.hb .tr i{display:block;height:100%}
.hb .vv{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-bottom:12px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block}
.stack{display:flex;flex-direction:column;gap:14px}
.stk .rw{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:5px}
.stk .rw b{font-variant-numeric:tabular-nums}
.stk .tr{height:12px;background:var(--line-2);border-radius:6px;overflow:hidden}
.stk .tr i{display:block;height:100%;border-radius:6px}

.mz{border-collapse:separate;border-spacing:0}
.mz th,.mz td{border-bottom:1px solid var(--line-2);padding:8px 10px;font-size:12.5px;white-space:nowrap}
.mz thead th{position:sticky;top:0;background:#fff;z-index:3;vertical-align:bottom;cursor:default}
.mz .stk1{position:sticky;left:0;background:#fff;z-index:2;min-width:64px}
.mz .stk2{position:sticky;left:64px;background:#fff;z-index:2;min-width:260px;max-width:300px;white-space:normal;border-right:1px solid var(--line)}
.mz thead .stk1,.mz thead .stk2{z-index:5}
.mz th.cl{writing-mode:vertical-rl;transform:rotate(180deg);text-align:left;height:210px;max-height:210px;overflow:hidden;text-overflow:ellipsis;font-weight:600;color:var(--ink);font-size:11.5px;padding:8px 6px}
.mz th.sal{white-space:normal;min-width:78px;max-width:96px;font-weight:600;color:var(--ink);vertical-align:bottom}
.mz th.sal.gf{color:#2b56a8}
.mz td.sat{border-right:1px solid var(--line)}
.mz td.q.sai{color:#2b56a8;font-weight:600}
.mz tr.progrow td{background:#e9eff9;border-top:2px solid #01337c;border-bottom:1px solid #c9d3e6;padding:9px 10px}
.mz tr.progrow td.stk2{font-weight:700;color:#01337c;font-size:13px;letter-spacing:.01em}
.mz tr.progrow td.stk2 span{font-weight:500;color:#5b6878;font-size:11.5px;margin-left:8px}
.card.semest{border:1.5px solid #f0b8ad;box-shadow:0 0 0 4px #fbe8e4}
.card.semest .hd{background:#fdf3f1}
.card.semest .hd h3{color:#b23c28}
.mz th.cl.pjcol{font-style:italic}
.mz td.q.pj{font-style:italic;box-shadow:inset 0 0 0 1px #c9b0e6}
.badge.pj{background:#f3ecfa;color:#6b3fa0}
.help.pjbox{background:#f6f0fc;border-color:#d9c6f0;color:#4f2d7f}
.seg.pjseg button.on{background:#6b3fa0}
.mz th.cl.vbcol{background:#fff4e8;color:#a34b0b}
.mz th.cl i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-bottom:6px}
.mz td.q{text-align:center;font-variant-numeric:tabular-nums;min-width:58px}
.mz td.q.ok{color:#157950;font-weight:600}
.mz td.q.pa{color:#b36b00;font-weight:700;text-decoration:underline dotted}
.mz td.q.no{color:#c0392b;font-weight:700}
.mz .fim{background:#f9f9fb;font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.mz .fim1{border-left:2px solid var(--navy)}
.mz .r1,.mz .r2,.mz .r3,.mz .r4,.mz .r5{position:sticky;z-index:2;min-width:88px;max-width:88px;background:#f9f9fb}
.mz .r5{right:0}.mz .r4{right:88px}.mz .r2{right:176px}.mz .r1{right:264px;border-left:2px solid var(--navy)}
.mz thead .r1,.mz thead .r2,.mz thead .r3,.mz thead .r4,.mz thead .r5{z-index:5;background:#fff;white-space:normal}
.mz tr.grp td{border-bottom-color:transparent}
.mz tr.gini td{border-top:1px solid #c9d3e6}
.mz tr.gfim td{border-bottom:1px solid #c9d3e6}
.vb{display:inline-block;font-size:10.5px;font-weight:600;padding:1px 7px;border-radius:20px;margin-top:3px;white-space:nowrap}
.vb.nova{background:var(--navy);color:#fff}
.vb.antiga{background:#fff;color:#7a5a0a;border:1px solid #e5c77e}
.vb.fora{background:#eef0f5;color:var(--muted)}
.mz tfoot td{position:sticky;bottom:0;background:#f4f5f8;font-weight:600;z-index:2}
.mz tfoot .stk1,.mz tfoot .stk2{z-index:4;background:#f4f5f8}
/* ---------- Misc ---------- */
.cols-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.muted{color:var(--muted)}
.help{background:var(--blue-soft);border:1px solid #cfe0fb;color:#2b4f96;padding:11px 14px;border-radius:10px;font-size:12.5px;display:flex;gap:9px;align-items:flex-start}
.help svg{width:17px;height:17px;flex:none;margin-top:1px}
.warn{background:var(--amber-soft);border-color:#f0d38a;color:#7a5a0a}
.empty-st{text-align:center;padding:40px 20px;color:var(--muted)}
.rules{margin:0;padding-left:18px;font-size:13px;line-height:1.75}
.rules b{color:var(--navy-900)}
.form-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px 16px}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:12px;font-weight:500;color:var(--muted)}
.field input,.field select{border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:#fff;outline:none}
.field input:focus{border-color:var(--navy);box-shadow:0 0 0 3px rgba(1,51,124,.12)}
.overlay{position:fixed;inset:0;background:rgba(17,32,63,.45);backdrop-filter:blur(2px);z-index:100;display:none;align-items:flex-start;justify-content:center;padding:34px 18px;overflow-y:auto}
.overlay.open{display:flex}
.modal{background:#fff;border-radius:16px;width:100%;max-width:980px;box-shadow:var(--sh-lg);overflow:hidden}
.modal .mhd{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;background:#fafafc}
.modal .mhd .ic{width:38px;height:38px;border-radius:11px;background:var(--navy);display:grid;place-items:center;color:var(--gold);flex:none}
.modal .mhd .ic svg{width:18px;height:18px}
.modal .mhd h3{font-size:16px;font-weight:600}
.modal .mhd .ms{font-size:12px;color:var(--muted)}
.modal .mbd{padding:22px;max-height:70vh;overflow-y:auto}
.x{margin-left:auto;border:none;background:#f0f0f3;width:30px;height:30px;border-radius:980px;color:var(--muted);font-size:16px;display:grid;place-items:center}
.x:hover{background:#e6e6eb}
.minis{display:flex;gap:26px;flex-wrap:wrap;margin-bottom:16px}
.minis div{display:flex;flex-direction:column}
.minis span{font-size:11px;color:var(--muted)}
.minis b{font-size:18px;font-weight:600;color:var(--navy-900);font-variant-numeric:tabular-nums}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--navy-900);color:#fff;padding:12px 20px;border-radius:11px;font-size:13px;font-weight:600;box-shadow:var(--sh-lg);z-index:200;opacity:0;transition:.25s;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media (max-width:1080px){.kpis{grid-template-columns:repeat(2,1fr)}.cols-2{grid-template-columns:1fr}.form-grid{grid-template-columns:repeat(2,1fr)}}
@media (max-width:760px){.app{grid-template-columns:1fr}.sidebar{display:none}.kpis{grid-template-columns:1fr}.hero{grid-column:span 1}.content{padding:16px}.topbar{padding:0 16px}.base-tag{display:none}.hero .pct{position:static;text-align:left;margin-bottom:10px}#printBtn{display:none}.topbar h1{font-size:16px}}
@media print{
  .sidebar,.topbar .btn,.no-print{display:none !important}
  .app{display:block}.topbar{position:static;background:#fff}.content{padding:0;max-width:100%}
  .card,.kpi,.hero{box-shadow:none;break-inside:avoid}
  .tbl-scroll{overflow:visible;max-height:none}.tbl-scroll thead th,.tbl-scroll tfoot td{position:static}
  body{background:#fff;font-size:10.5px}
  .kpis{grid-template-columns:repeat(4,1fr) !important}.cols-2{grid-template-columns:1fr 1fr !important}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>

<script>

const esc = s => (''+(s??'')).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fn = v => Math.round(+v||0).toLocaleString('pt-BR');

const brlK = v => { v=+v||0; if(Math.abs(v)>=1e6) return 'R$ '+(v/1e6).toFixed(2).replace('.',',')+' mi'; if(Math.abs(v)>=1e3) return 'R$ '+Math.round(v/1e3).toLocaleString('pt-BR')+' mil'; return brl(v); };

/* ---------- Exportação Excel (.xlsx formatado, sem internet) ----------
   Layout padrão de todos os relatórios: título, linha de contexto (data, estoque, cenário e filtros),

   legenda de cores, página em paisagem ajustada à largura com cabeçalho repetido e "Página X de Y". */
const XL=(()=>{
  const NAVY='01337C', LINHA='D9DCE3';
  const xe=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,'');
  const colL=n=>{let s='';n++;while(n){const m=(n-1)%26;s=String.fromCharCode(65+m)+s;n=(n-m-1)/26;}return s;};
  const FMT={int:3,dec:4,pct:9,money:164};
  function estilos(){
    const fonts=[],fills=['<fill><patternFill patternType="none"/></fill>','<fill><patternFill patternType="gray125"/></fill>'],borders=['<border><left/><right/><top/><bottom/><diagonal/></border>'],xfs=[],idx={};
    const add=(arr,x)=>{let i=arr.indexOf(x);if(i<0){arr.push(x);i=arr.length-1;}return i;};
    const font=f=>add(fonts,`<font>${f.b?'<b/>':''}${f.i?'<i/>':''}<sz val="${f.sz||10}"/><color rgb="FF${f.c||'1D1D1F'}"/><name val="Calibri"/><family val="2"/></font>`);
    font({});
    const get=(o={})=>{const k=JSON.stringify(o); if(idx[k]!=null) return idx[k];
      const fi=font({b:o.b,i:o.i,sz:o.sz,c:o.c});

/* ---------- Visão geral ---------- */
function vGeral(){
  const {it,all,pok}=calc();
  const P=D.props;
  const usadas=P.filter((p,i)=>pok[i]);
  const cliDem=new Set(usadas.map(p=>p.uf+'|'+p.cli)).size;
  const falta=it.filter(x=>x.falta>0);
  const totFalta=falta.reduce((a,x)=>a+x.falta,0);
  const totNec=all.reduce((a,x)=>a+x.nec,0);
  const totCons=all.reduce((a,x)=>a+x.cons,0);
  const cobertos=all.reduce((a,x)=>a+x.usa,0);
  const usaAnt=all.filter(x=>x.ver==='antiga').reduce((a,x)=>a+x.usa,0);
  const custo=falta.reduce((a,x)=>a+x.custo,0);
  const semCusto=falta.filter(x=>!x.cu).length;
  const saldoIt=it.reduce((a,x)=>a+Math.max(0,x.s),0);
  // por temperatura
  const porT={}; TEMPS.forEach(t=>porT[t]={un:0,v:0,n:0});
  it.forEach(x=>TEMPS.forEach(t=>porT[t].un+=x.q[t]));
  usadas.forEach(p=>{porT[p.t].v+=p.v;porT[p.t].n++;});
  const maxT=Math.max(1,...TEMPS.map(t=>porT[t].un));
  // sem itens
  const semIt=P.filter(p=>!p.u && /Sem itens/.test(p.m) && (!S.vend||p.vend===S.vend) && (!S.uf||p.uf===S.uf));
  const semT={}; TEMPS.forEach(t=>semT[t]={n:0,v:0}); semIt.forEach(p=>{semT[p.t].n++;semT[p.t].v+=p.v;});
  const top=falta.slice().sort((a,b)=>b.falta-a.falta).slice(0,20);
  const covOf=x=>x.grp&&S.versoes?Math.max(0,x.grp.reduce((a,m)=>a+m.usa,0)):Math.min(Math.max(0,x.s),x.nec);
  const maxTop=Math.max(1,...top.map(x=>covOf(x)+x.falta));
  $('#content').innerHTML = cenarioBar()+`
  <div class="kpis">
    <div class="hero"><div class="pct"><div class="n">${fp(totNec?cobertos/totNec:1)}</div><div class="t">da necessidade coberta pelo estoque</div></div>
      <div class="lbl">Produção necessária</div><div class="big">${fn(totFalta)} un.</div>
      <div class="sub">${fn(falta.length)} de ${fn(it.length)} itens precisam ser produzidos${custo?` · custo estimado ${brlK(custo)}`:''}${semCusto?` (${semCusto} sem custo de referência)`:''}${S.versoes&&usaAnt?` · ${fn(usaAnt)} un. saem de versões antigas`:''}</div>
      <div class="progress"><i style="width:${Math.min(100,totNec?cobertos/totNec*100:100)}%"></i></div></div>
    <div class="kpi"><div class="lbl">Clientes na demanda</div><div class="val">${fn(cliDem)}</div><div class="meta">${fn(usadas.length)} propostas com itens · ${brlK(usadas.reduce((a,p)=>a+p.v,0))}</div></div>
    <div class="kpi"><div class="lbl">Demanda considerada</div><div class="val">${fn(totCons)}</div><div class="meta">unidades ${S.modo==='ponderada'?'ponderadas':'(100%)'}${+S.seg?` · +${S.seg}% segurança = ${fn(totNec)}`:''}</div></div>
  </div>
  ${(()=>{ const pr=D.props.filter(p=>p.pj), un=all.reduce((a,x)=>a+x.pj,0), uc=all.reduce((a,x)=>a+x.pjc,0); return pr.length?`<div class="help pjbox" style="margin-top:16px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l9 10-9 10-9-10z"/></svg><div><b>◇ Projeção ${S.proj?'incluída':'NÃO incluída'} no cálculo:</b> ${fn(pr.length)} clientes com proposta ainda sem itens no Gerador entram com o que enviamos a eles no ciclo passado (versão mais nova de cada item): ${fn(un)} un.${S.proj&&S.modo==='ponderada'?`, ${fn(uc)} un. consideradas pela temperatura`:''}. Quando o Comercial gerar a proposta no Gerador, ela substitui a projeção sozinha.</div></div>`:''; })()}
  ${DSC.un?`<div class="help warn" style="margin-top:16px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l10 18H2L12 3z"/><path d="M12 10v5M12 18h0"/></svg><div><b>Descarte previsto descontado do saldo:</b> ${fn(DSC.un)} un. de ${fn(DSC.itens)} itens da lista <i>${esc(DSC.arq)}</i>, até o descarte ser lançado no ERP${DSC.erp?` (${fn(DSC.erp)} un. já lançadas)`:''}. Itens marcados com <span class="falta">†</span>.</div></div>`:''}
  <div class="cols-2" style="margin-top:16px">
    <div class="card"><div class="hd"><h3>Demanda por temperatura</h3><span class="sub">unidades das propostas com itens (100%)</span></div><div class="bd"><div class="stack">
      ${TEMPS.map(t=>`<div class="stk"><div class="rw"><span>${tb(t)} <span class="muted" style="font-size:11.5px">· ${porT[t].n} propostas · ${brlK(porT[t].v)}${S.modo==='ponderada'&&S.temps[t]?` · conta ${fn(S.pcts[t])}%`:''}${!S.temps[t]?' · fora do cálculo':''}</span></span><b>${fn(porT[t].un)} un.</b></div>
        <div class="tr"><i style="width:${porT[t].un/maxT*100}%;background:${TCOR[t]};opacity:${S.temps[t]?1:.3}"></i></div></div>`).join('')}
    </div></div></div>
    <div class="card"><div class="hd"><h3>Propostas sem itens detalhados</h3><span class="sub">não entram no cálculo por item</span></div><div class="bd">
      <div class="minis"><div><span>Propostas</span><b>${fn(semIt.length)}</b></div><div><span>Valor 26/27</span><b>${brlK(semIt.reduce((a,p)=>a+p.v,0))}</b></div><div><span>Estoque IAB (itens demandados)</span><b>${fn(saldoIt)} un.</b></div></div>
      <table><thead><tr><th>Temperatura</th><th class="num">Propostas</th><th class="num">Valor 26/27</th></tr></thead><tbody>
      ${TEMPS.map(t=>`<tr><td>${tb(t)}</td><td class="num">${fn(semT[t].n)}</td><td class="num">${brl(semT[t].v)}</td></tr>`).join('')}</tbody></table>
      <div class="help warn" style="margin-top:14px">Esses clientes ainda não têm a proposta gerada no Gerador do CRM. Quando o Comercial gerar, os itens entram aqui na próxima atualização.</div>
    </div></div>
  </div>
  <div class="section-title"><span class="ix">Prioridade</span><h2>Itens com maior falta</h2><span class="ln"></span></div>
  <div class="card"><div class="bd">
    <div class="legend"><span><i style="background:var(--navy)"></i>Coberto pelo estoque IAB</span><span><i style="background:var(--red)"></i>Falta produzir</span></div>
    ${top.length?`<div class="hbars">${top.map(x=>{const cov=covOf(x);return `<div class="hb click" data-item="${x.i}" style="cursor:pointer" title="Ver clientes">
      <div class="nm"><small>${x.c}</small>${esc(x.d)}</div>
      <div class="tr"><i style="width:${cov/maxTop*100}%;background:var(--navy)"></i><i style="width:${x.falta/maxTop*100}%;background:var(--red)"></i></div>
      <div class="vv falta">${fn(x.falta)}</div></div>`;}).join('')}</div>`:'<div class="empty-st">Nenhum item com falta neste cenário.</div>'}
  </div></div>`;
  bindCenario();
  document.querySelectorAll('[data-item]').forEach(e=>e.onclick=()=>modalItem(+e.dataset.item));
}

/* ---------- Necessidade de produção ---------- */
const COLS=[
  {k:'c',t:'Cód.'},{k:'d',t:'Item / programa'},{k:'s',t:'Saldo atual',num:1},{k:'sov',t:'Saldo outras versões',num:1},{k:'rgt',t:'Recebido gráficas',num:1},{k:'qs',t:'Já saiu p/ propostas',num:1},{k:'pj',t:'◇ Da projeção',num:1},
  {k:'cons',t:'Demanda considerada',num:1},{k:'nec',t:'Necessidade',num:1,seg:1},{k:'falta',t:'Falta (produzir)',num:1},
  {k:'cob',t:'Cobertura',num:1},
  {k:'Fechada',t:'Fechada',num:1,tq:1},{k:'Quente',t:'Quente',num:1,tq:1},{k:'Morna',t:'Morna',num:1,tq:1},{k:'Fria',t:'Fria',num:1,tq:1},
  {k:'ncli',t:'Clientes',num:1},{k:'custo',t:'Custo estimado',num:1}];
function val(x,k){ if(TEMPS.includes(k)) return x.q[k]; if(k==='pr') return (x.pr||[]).join(', '); return x[k]; }
function linhasProducao(){
  const {it}=calc(); const q=S.busca.trim().toLowerCase();
  let r=it.filter(x=>(!S.soFalta||x.falta>0) && (!S.prog||(x.pr||[]).includes(S.prog)) && (!q || (x.c+' '+x.d+' '+x.n).toLowerCase().includes(q)));
  const {k,d}=S.sort; r.sort((a,b)=>{const va=val(a,k),vb=val(b,k); return (typeof va==='string'?va.localeCompare(vb,'pt-BR'):(va-vb))*d;});
  return {r,it};
}
function vProducao(){
  const progs=[...new Set(D.itens.flatMap(x=>x.pr||[]))].sort((a,b)=>a.localeCompare(b,'pt-BR'));
  $('#content').innerHTML = cenarioBar()+`
  <div class="card"><div class="hd">
    <div class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg><input id="busca" placeholder="Buscar código ou item" value="${esc(S.busca)}" aria-label="Buscar item"></div>
    <select class="sel" id="progSel" aria-label="Programa">${opts(progs,S.prog,'Todos os programas')}</select>
    <div class="chips"><button type="button" class="chip ${S.soFalta?'on':''}" id="soFalta">Só itens com falta</button><button type="button" class="chip ${!S.soFalta?'on':''}" id="todos">Todos os itens</button></div>
    <div class="spacer"></div><span class="sub" id="cnt"></span>
    <button class="btn sm no-print" id="csvBtn" type="button">Exportar Excel</button>
  </div><div class="tbl-scroll" id="tblWrap"></div></div>
  <div class="help no-print" style="margin-top:14px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h0"/></svg>
  <div><b>Falta (produzir)</b> = Necessidade − Saldo IAB. Necessidade = demanda considerada ${S.modo==='ponderada'?'(quantidade × % da temperatura)':'(100% das temperaturas marcadas)'} + margem de segurança. Clique numa linha para ver os clientes. <sup>*</sup> item com quantidade consignada na Verbum (passe o mouse para ver; não soma no saldo).${DSC.un?` <sup class="falta">†</sup> saldo já descontado do descarte previsto (${fn(DSC.un)} un. de ${fn(DSC.itens)} itens, até o descarte entrar no ERP).`:''}</div></div>`;
  $('#content').insertAdjacentHTML('beforeend', blocoSemEstoque());
  document.querySelectorAll('.semest tr[data-item]').forEach(e=>e.onclick=()=>modalItem(+e.dataset.item));
  bindCenario();
  const b=$('#busca'); b.oninput=()=>{S.busca=b.value;tabela();};
  $('#progSel').onchange=e=>{S.prog=e.target.value;tabela();};
  $('#soFalta').onclick=()=>{S.soFalta=true;persist();vProducao();};
  $('#todos').onclick=()=>{S.soFalta=false;persist();vProducao();};
  $('#csvBtn').onclick=exportCSV;
  tabela();
}
function tabela(){
  const {r}=linhasProducao();
  const cols=COLS.filter(c=>!c.seg||+S.seg);
  const tot=k=>r.reduce((a,x)=>a+(+val(x,k)||0),0);
  const th=cols.map(c=>`<th class="${c.num?'num':''} ${S.sort.k===c.k?'sorted':''}" data-k="${c.k}" ${c.tq?`style="color:${TCOR[c.k]}"`:''}>${c.t}${S.sort.k===c.k?`<span class="ar">${S.sort.d>0?'▲':'▼'}</span>`:''}</th>`).join('');
  const cell={
    c:x=>`<td class="cod">${x.c}</td>`,
    d:x=>`<td style="min-width:300px;max-width:420px"><div class="itn">${esc(x.d)}${x.ver?` <span class="vb ${x.ver}">${verTxt(x)}</span>`:''}</div><div class="prg" style="max-width:420px" title="${esc((x.pr||[]).join(' | '))}">${esc((x.pr||[]).join(' · '))}</div></td>`,
    s:x=>`<td class="num" title="${esc([x.cs?`+${fn(x.cs)} consignado na Verbum (não soma)`:'',dscTip(x)].filter(Boolean).join(' · '))}">${fn(x.s)}${x.cs?'<sup class="muted">*</sup>':''}${x.ds?'<sup class="falta">†</sup>':''}</td>`,
    sov:x=>`<td class="num" ${x.grp?`title="${esc(x.grp.filter(m=>m!==x).map(m=>m.c+': '+fn(m.s)).join(' · '))}"`:''}>${x.sov?fn(x.sov):'<span class="muted">–</span>'}</td>`,
    cons:x=>`<td class="num">${fn(x.cons)}</td>`, nec:x=>`<td class="num">${fn(x.nec)}</td>`,
    falta:x=>`<td class="num ${x.falta>0?'falta':'ok'}">${x.falta>0?fn(x.falta):'OK'}</td>`,
    cob:x=>{const cob=x.cob, cc=cob>=1?'var(--green)':cob>=.5?'var(--amber)':'var(--red)';return `<td class="num"><div style="display:flex;align-items:center;gap:8px;justify-content:flex-end"><span style="font-size:12px">${isFinite(cob)?fp(cob):'—'}</span><div class="inbar" style="width:60px"><i style="width:${Math.min(100,(isFinite(cob)?cob:1)*100)}%;background:${cc}"></i></div></div></td>`;},
    ncli:x=>`<td class="num">${x.ncli}</td>`,
    rgt:x=>`<td class="num" title="${esc(x.rg.map(([g,q])=>GRAF[g]+': '+fn(q)).join(' · '))}">${x.rgt?fn(x.rgt):'<span class="muted">–</span>'}</td>`,
    pj:x=>`<td class="num" style="color:#6b3fa0;font-style:italic" title="Parte da demanda (falta sair) que vem de projeção">${x.pj?fn(x.pj):'<span class="muted">–</span>'}</td>`,
    qs:x=>`<td class="num">${x.qs?fn(x.qs):'<span class="muted">–</span>'}</td>`,
    custo:x=>`<td class="num" title="${x.cu?`Custo unit. ${brl(x.cu)} (entrada de ${x.cud})`:'Sem custo de referência no ERP'}">${x.falta&&x.cu?brl(x.custo):'<span class="muted">–</span>'}</td>`};
  TEMPS.forEach(t=>cell[t]=x=>`<td class="num" style="${S.temps[t]?'':'opacity:.4'}">${x.q[t]?fn(x.q[t]):'<span class="muted">–</span>'}</td>`);
  const ft={c:'',d:`Total (${fn(r.length)} itens)`,s:fn(tot('s')),sov:'',rgt:fn(tot('rgt')),qs:fn(tot('qs')),pj:fn(tot('pj')),cons:fn(tot('cons')),nec:fn(tot('nec')),falta:`<span class="falta">${fn(tot('falta'))}</span>`,cob:'',ncli:'',custo:brl(tot('custo'))};
  TEMPS.forEach(t=>ft[t]=fn(tot(t)));
  $('#tblWrap').innerHTML = r.length?`<table><thead><tr>${th}</tr></thead><tbody>${r.map(x=>`<tr class="click" data-item="${x.i}">${cols.map(c=>cell[c.k](x)).join('')}</tr>`).join('')}</tbody>
    <tfoot><tr>${cols.map(c=>`<td class="${c.num?'num':''}">${ft[c.k]}</td>`).join('')}</tr></tfoot></table>`
    :'<div class="empty-st">Nenhum item encontrado com esses filtros.</div>';
  $('#cnt').textContent=fn(r.length)+' itens';
  document.querySelectorAll('#tblWrap th[data-k]').forEach(h=>h.onclick=()=>{const k=h.dataset.k; S.sort={k,d:S.sort.k===k?-S.sort.d:(['c','d'].includes(k)?1:-1)}; tabela();});
  document.querySelectorAll('#tblWrap tr[data-item]').forEach(e=>e.onclick=()=>modalItem(+e.dataset.item));
}

function blocosMatriz(){
  const {it,all,pok,lin}=calc(); const M=S.mz;

  const cl={}, cel={};
  D.linhas.forEach(([pi,ii],n)=>{ const L=lin[n]; if(!L.ok) return; const p=D.props[pi]; const k=p.uf+'|'+p.cli;
    const pc=p.pj?'Projeção':p.t;
    if(!cl[k]) cl[k]={k,cli:p.cli,uf:p.uf,t:p.t,cls:pc,st:p.st,dts:p.dts,vb:p.tipo==='Consignação',pj:!!p.pj};
    if(ORD_T[p.t]<ORD_T[cl[k].t]) cl[k].t=p.t;
    if(ORD_C[pc]<ORD_C[cl[k].cls]){ cl[k].cls=pc; cl[k].pj=!!p.pj; }
    const c=(cel[ii]=cel[ii]||{}), z=(c[k]=c[k]||{p:0,s:0,r:0,c:0}); z.p+=L.q; z.s+=L.s; z.r+=L.rem; z.c+=L.rem*fator(p.t); });
  const vcel=z=>!z?0:M.val==='proposta'?z.p:M.val==='saiu'?z.s:M.val==='considerado'?z.c:z.r;
  const clientes=Object.values(cl).sort((a,b)=>ORD_C[a.cls]-ORD_C[b.cls]||ORD_T[a.t]-ORD_T[b.t]||b.st-a.st||a.cli.localeCompare(b.cli,'pt-BR'));
  const q=M.busca.trim().toLowerCase();
  const passa=x=>(!M.prog||(x.pr||[]).includes(M.prog)) && (!q||(x.c+' '+x.d).toLowerCase().includes(q))
    && (M.filtro==='todos'||(M.filtro==='falta'?x.falta>0:M.filtro==='sobra'?x.sobra>0:(x.falta===0&&x.sobra===0)));
  // bloco = item sozinho, ou todas as versões do mesmo item (mais nova primeiro); entra se qualquer versão passar no filtro
  const vistos=new Set(), blocos=[];
  for(const x of it){ if(vistos.has(x.i)) continue;
    const ms=x.grp?x.grp.filter(m=>m.bruta>0||m.s>0||m.falta>0||m.qs>0).slice().sort((a,b)=>b.c-a.c):[x];
    ms.forEach(m=>vistos.add(m.i));
    if(!ms.some(passa)) continue;
    const sm=k=>ms.reduce((a,m)=>a+m[k],0);
    const pm=ms.reduce((a,m)=>((D.itens[m.i].po??15)<(D.itens[a.i].po??15)?m:a));
    blocos.push({ms,g:!!x.grp,falta:sm('falta'),sobra:sm('sobra'),d:ms[0].d,po:D.itens[pm.i].po??15,pn:D.itens[pm.i].pn||'Sem programa'}); }
  const cmpF=M.filtro==='sobra'?(a,b)=>b.sobra-a.sobra:(a,b)=>b.falta-a.falta||a.sobra-b.sobra||a.d.localeCompare(b.d,'pt-BR');
  // por programa: na sequência combinada (Pré I, Pré II, 1º ano...); cada item só no primeiro programa em que aparece
  blocos.sort(M.ord==='programa'?(a,b)=>a.po-b.po||cmpF(a,b):cmpF);
  const blocosOrig=blocos.slice();   // grupos de versões inteiros (o saldo das versões é calculado no grupo)
  if(M.ord==='programa') blocos.splice(0,blocos.length,...juntarVolumes(blocos));   // Vol. I, Vol. II... em sequência
  let ng=0; const cores=new Map(); blocos.forEach(b=>{ if(b.g){ const k=b.orig||b; if(!cores.has(k)) cores.set(k,GCOR[ng++%GCOR.length]); b.cor=cores.get(k); } });

  const cols=clientes.filter(c=>rows.some(r=>cel[r.x.i]&&cel[r.x.i][c.k]));
  // saldo atual que atende o que falta sair de cada cliente: com versões, o saldo do grupo inteiro (mais nova → mais antiga)
  const est={};
  for(const b of blocosOrig){
    if(b.g&&S.versoes){ let pool=b.ms.reduce((a,m)=>a+Math.max(0,m.s),0);
      for(const m of b.ms){ const dem=Object.values(cel[m.i]||{}).reduce((a,z)=>a+z.r,0); est[m.i]=Math.min(pool,dem); pool-=est[m.i]; } }
    else b.ms.forEach(m=>est[m.i]=Math.max(0,m.s)); }
  const status=x=>{ let rest=est[x.i]||0; const c=cel[x.i]||{};
    return cols.map(cc=>{ const z=c[cc.k]; if(!z) return null; const v=vcel(z);
      const base=`Proposta ${fn(z.p)} · já saiu ${fn(z.s)} · falta sair ${fn(z.r)}`;
      if(z.r<=1e-9) return {v,cls:'sai',tip:base+' — tudo enviado'};
      const cls=rest>=z.r-1e-9?'ok':rest>0?'pa':'no';
      const tip=base+' — '+(cls==='ok'?'saldo atende':cls==='pa'?`saldo cobre ${fn(rest)} de ${fn(z.r)}`:'sem saldo'); rest=Math.max(0,rest-z.r); return {v,cls,tip}; }); };
  const dem=x=>M.val==='proposta'?x.qp:M.val==='saiu'?x.qs:M.val==='considerado'?x.cons:x.bruta;

const ROM={i:1,ii:2,iii:3,iv:4,v:5};
function volInfo(d){
  const t=String(d||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
  const m=/\(?\bvol(?:ume)?\b\.?\s*(iv|v|i{1,3}|\d+)\b\)?/.exec(t); if(!m) return null;
  const n=ROM[m[1]]||+m[1]; if(!n) return null;
  return {n, base:(t.slice(0,m.index)+' '+t.slice(m.index+m[0].length)).replace(/[^a-z0-9]+/g,'')};
}
function juntarVolumes(bs){
  // Livros com volumes: cada edição sai com seus volumes em sequência (edição nova: Vol. I, Vol. II; depois a antiga: Vol. I,
  // Vol. II). As versões continuam ligadas (mesma cor e saldo antigo usado antes de imprimir), só a ordem das linhas muda.
  const out=[], usado=new Set(), vk=b=>{ const v=volInfo(b.d); return v&&{v,base:v.base}; };
  const famBase=b=>{ for(const m of b.ms){ const v=volInfo(m.d); if(v) return v.base; } return null; };
  bs.forEach((b,i)=>{ if(usado.has(i)) return; const base=famBase(b); if(!base){ usado.add(i); out.push(b); return; }
    const fam=bs.map((z,j)=>({z,j})).filter(o=>!usado.has(o.j)&&o.z.pn===b.pn&&famBase(o.z)===base);
    const pecas=[];
    fam.forEach(o=>{ usado.add(o.j); const ms=o.z.ms;
      ms.forEach((m,ed)=>{ const v=volInfo(m.d); pecas.push({b:o.z,m,ed,n:v?v.n:99,c:m.c}); }); });
    pecas.sort((p,q)=>p.ed-q.ed||p.n-q.n||q.c-p.c);
    if(pecas.every(p=>p.b.ms.length===1)){ pecas.forEach(p=>out.push(p.b)); return; }
    pecas.forEach(p=>out.push(p.b.ms.length===1?p.b:{...p.b,orig:p.b,ms:[p.m],falta:p.m.falta,sobra:p.m.sobra,d:p.m.d}));
  });
  return out;
}

/* ---------- Falta x Análise de Estoque ---------- */
function situacao(x, faltaSemProj){
  // Olha o item E as outras versões do grupo (a falta fica no código novo, mas o alerta pode estar na versão antiga)
  const ms=x.grp||[x], duros=[], notas=[]; let vbSobra=0;
  const pre=m=>m===x?'':`cód. ${m.c}: `;
  for(const m of ms){ const a=D.itens[m.i].an; if(!a) continue;
    if(a.al) duros.push(pre(m)+a.al);
    else if(m.s<0||a.at<0) duros.push(pre(m)+`Saldo negativo no IAB (${fn(m.s)})`);
    if(a.vb!=null&&Math.round(a.vb)<0) duros.push(pre(m)+'Consignação Verbum: '+(a.vba||'saldo '+fn(a.vb)+' na Verbum'));
    if(a.vb!=null&&Math.round(a.vb)>0) vbSobra+=a.vb; }
  if(!ms.some(m=>D.itens[m.i].an)) return {k:'sem',t:'Sem análise',cls:'gr',msg:'Item sem movimentação no estoque do IAB.'};
  // sobra na Verbum só segura a produção se ela cobrir boa parte da falta; resto pequeno vira só observação
  if(vbSobra>0){ const t=`Sobra ${fn(vbSobra)} na Verbum (pode voltar ao IAB)`; if(vbSobra>=Math.max(10,x.falta*0.1)) duros.push(t); else notas.push(t); }
  if(duros.length) return {k:'conf',t:'Conferir lançamento',cls:'a',msg:duros.concat(notas).join(' · ')};
  // a projeção também é falta real para a gráfica (combinado em 22/10/2026); só fica anotada
  if(faltaSemProj!=null&&faltaSemProj<=0) notas.unshift('◇ Falta vem da projeção (clientes com proposta ainda sem itens)');
  return {k:'real',t:'Falta real',cls:'r',msg:notas.join(' · ')};
}

/* ---------- Regras ---------- */
function vRegras(){
  const nP=D.props.length, nU=D.props.filter(p=>p.u).length;
  $('#content').innerHTML=`
  <div class="card"><div class="hd"><h3>Parâmetros do cálculo</h3><span class="sub">ficam salvos neste computador</span></div><div class="bd">
    <div class="form-grid">
      ${TEMPS.map(t=>`<div class="field"><label for="p_${t}">${tb(t)} — % que entra na ponderada</label><input id="p_${t}" type="number" min="0" max="100" value="${S.pcts[t]}" ${t==='Fechada'?'disabled':''}></div>`).join('')}
      <div class="field"><label for="p_seg">Margem de segurança (%)</label><input id="p_seg" type="number" min="0" max="100" value="${+S.seg||0}"></div>
    </div>
    <div style="display:flex;gap:10px;margin-top:16px"><button class="btn primary" id="salvar" type="button">Salvar parâmetros</button><button class="btn" id="restaurar" type="button">Voltar aos % do CRM de Vendas</button></div>
    <p class="muted" style="font-size:12px;margin:12px 0 0">Os % padrão vêm da configuração do CRM de Vendas (Estimativa de receita): Quente ${D.pcts.Quente}%, Morna ${D.pcts.Morna}%, Fria ${D.pcts.Fria}%.</p>
  </div></div>
  <div class="section-title"><span class="ix">Regras</span><h2>Como a demanda é montada</h2><span class="ln"></span></div>
  <div class="card"><div class="bd"><ol class="rules">
    <li><b>Fonte:</b> propostas salvas pelo Comercial na pasta compartilhada do CRM (${fn(nP)} lidas, ${fn(nU)} entram com itens).</li>
    <li><b>Cliente</b> = mesma chave do CRM: categoria + UF + município/instituição + ciclo.</li>
    <li>De cada cliente vale a proposta <b>mais nova</b> de cada tipo (Venda e Bonificação). <b>Aditivos somam</b>. "Versão alternativa" não entra.</li>
    <li><b>Não entram:</b> propostas inativas, marcadas "sem contar", <i>Lead não convertido</i>, <i>Cliente perdido</i> e <i>Material enviado</i> (o material já saiu e já está fora do saldo).</li>
    <li><b>Empenho enviado</b> conta como <b>Fechada</b> (100%).</li>
    <li>Só entram itens com código: a quantidade é a da proposta gerada no Gerador do CRM, somando todos os kits (aluno, professor, coordenação...).</li>
    <li><b>Estoque</b> = saldo próprio do IAB <b>calculado</b> pela Movimentação de Estoque (implantação + entradas − saídas), com o mesmo código da Análise de Estoque: ignora Lincky, serviços, e-books e brindes Coala, e cria a saída do IAB na consignação para a Verbum. O que está <b>consignado na Verbum não soma</b>. A coluna "Saldo após movimento" do ERP <b>não é usada</b>.</li>
    <li><b>Versão antiga sem saldo:</b> se a proposta, a projeção ou a consignação traz o código de uma <b>versão antiga</b> que está <b>sem saldo</b> no IAB, a quantidade é lançada na <b>versão nova</b> e o código antigo não aparece no relatório (no detalhe do item fica anotado "proposta com cód. X"). Se a versão antiga ainda tem saldo, ela continua aparecendo e é usada antes de imprimir.</li>
    <li><b>Cálculo (23/10/2026):</b> Falta (imprimir) = <b>demanda total (100%)</b> − saldo atual; se o saldo for maior, a diferença vai para a Sobra. Sem % por temperatura e sem margem de segurança. Nas <b>versões do mesmo livro</b>, soma a demanda e o saldo de todas as versões e o resultado aparece no código mais novo (as versões antigas mostram "no cód. X").</li>
    <li><b>Fora do relatório:</b> itens <b>sem programa</b> e <b>brindes</b> não aparecem (nem na demanda, nem no saldo, nem na falta).</li>
    <li><b>Programa do item:</b> se o item vem em mais de um programa nas propostas (ex.: Grafismo Letras de Forma no kit da Pré-Escola I e da Pré-Escola II), vale o programa que também está no cadastro da Análise de Estoque (<code>cadastro_itens_programas.csv</code>). Sem coincidência, vale o primeiro programa da sequência nas propostas.</li>
    <li><b>Saldo negativo:</b> é erro de baixa, corrigido pontualmente no ERP. Não aparece no relatório: o item é tratado com saldo 0.</li>
    <li><b>Versões com nome diferente:</b> a tabela <code>EQUIVALENCIAS</code> do script liga código antigo → novo quando o nome mudou (Agendas do Professor → Cadernos de Registro do Professor; Conte Outra Vez Livro Gigante → 2ª ed. 2025). <b>Fora da demanda:</b> itens em <code>ITENS_FORA_DEMANDA</code> (TELCS) não entram. <b>Brindes</b> entram na demanda, mas não no alerta de itens sem estoque.</li>
    <li><b>◇ Projeção:</b> proposta de cliente que ainda não tem itens no Gerador entra com o que o IAB enviou a ele nos 12 meses antes do corte (venda, entrega futura, bonificação e simples remessa, menos devoluções), sempre na <b>versão mais nova</b> de cada item. Fica destacada em roxo e pode ser desligada na barra de cálculo. Cliente que já tem outra proposta com itens não é projetado.</li>
    <li><b>Saldo congelado em ${esc(CORTE)}:</b> depois dessa data entram as notas de compra de cada <b>gráfica</b> (só livros da estimativa e suas versões) e as notas que <b>saíram para os clientes das propostas</b> (venda, entrega futura, bonificação, simples remessa e consignação Verbum; devoluções abatem). <b>Saldo atual</b> = saldo no corte + gráficas − saiu p/ propostas ± outras movimentações; é ele que entra no cálculo. A demanda de cada proposta passa a ser o que <b>falta sair</b>.</li>
    <li><b>Resumo de vendas:</b> notas do Relatório de faturamento por cliente (município e UF), separando venda, entrega futura, bonificação e simples remessa/outras saídas, com a condição de pagamento da proposta.</li>
    <li><b>Descarte previsto:</b> as quantidades da lista <i>24 - Descartes\\Descarte 2026.xlsx</i> (aba Dados para Contabilidade) saem do saldo enquanto o descarte não é lançado no ERP. Quando o ERP tiver a saída de descarte do item, só desconta o que ainda faltar (não conta em dobro). ${DSC.un?`Hoje: ${fn(DSC.un)} un. de ${fn(DSC.itens)} itens.`:'Hoje: nada a descontar.'}</li>
    <li><b>Verbum Educação</b> (cliente sem proposta no CRM): tudo o que o IAB enviou a ela <b>em consignação</b> entra como uma proposta <b>fechada</b> (coluna própria no Item x Clientes). Se o item enviado é de uma <b>versão antiga que está zerada</b> no IAB, a quantidade é somada na <b>versão nova</b>. Dá para tirar do cálculo na barra de cálculo.</li>
    <li><b>Versões:</b> códigos do IAB com a <b>mesma descrição</b> são versões do mesmo item; <b>código menor = versão mais antiga</b>. As versões com saldo aparecem junto do item da proposta (mesmo sombreamento). Com "Usar antes de imprimir" (padrão), a necessidade do grupo consome primeiro o saldo da versão mais antiga e a falta fica no código mais novo, que é o que se imprime. Dá para desligar na barra de cálculo.</li>
    <li><b>Falta</b> = (demanda considerada + margem de segurança) − saldo IAB. <b>Custo estimado</b> = falta × custo unitário da última entrada de compra/produção no ERP.</li>
  </ol></div></div>
  <div class="section-title"><span class="ix">Atualização</span><h2>Como atualizar</h2><span class="ln"></span></div>
  <div class="card"><div class="bd" style="font-size:13px;line-height:1.7">
    Dê dois cliques em <b>ATUALIZAR ESTIMATIVA.bat</b> (ou rode <code>python gerar_estimativa.py</code>) na pasta <i>10 - DASHIBOARDs\\Estimativa de Vendas</i>.
    O script lê as propostas mais recentes e a Movimentação de Estoque e regrava este arquivo.<br>
    <span class="muted">Gerado em ${esc(D.gerado)} · último movimento de estoque em ${esc(D.base_estoque)}.</span>
  </div></div>`;
  $('#salvar').onclick=()=>{['Quente','Morna','Fria'].forEach(t=>S.pcts[t]=Math.max(0,Math.min(100,+$('#p_'+t).value||0))); S.seg=Math.max(0,+$('#p_seg').value||0); persist(); toast('Parâmetros salvos');};
  $('#restaurar').onclick=()=>{S.pcts=Object.assign({Fechada:100},D.pcts); persist(); vRegras(); toast('% do CRM restaurados');};
}

function abrir(html){ const o=$('#overlay'); o.innerHTML=html; o.classList.add('open'); o.querySelector('.x').onclick=fechar; o.querySelector('.x').focus(); }
function fechar(){ $('#overlay').classList.remove('open'); }
$('#overlay').addEventListener('click',e=>{ if(e.target.id==='overlay') fechar(); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape') fechar(); });
const ICBOX='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8"/></svg>';
function modalItem(ii){
  const {all,pok}=calc(); const x=all.find(z=>z.i===ii)||{q:{},cli:new Set()}; const base=D.itens[ii];
  const rows=[]; for(const [pi,i2,q,kit] of D.linhas){ if(i2!==ii||!pok[pi]) continue; const p=D.props[pi]; rows.push({p,q,kit,c:q*fator(p.t)}); }
  rows.sort((a,b)=>b.q-a.q);
  abrir(`<div class="modal"><div class="mhd"><div class="ic">${ICBOX}</div><div><h3>${esc(base.d)}</h3><div class="ms">Código ${base.c} · ${esc((base.pr||[]).join(' | '))}</div></div><button class="x" type="button" aria-label="Fechar">×</button></div><div class="mbd">
    <div class="minis"><div><span>Saldo IAB</span><b>${fn(base.s)}</b></div>${base.cs?`<div><span>Consignado Verbum (não soma)</span><b>${fn(base.cs)}</b></div>`:''}<div><span>Demanda total (100%)</span><b>${fn(x.bruta)}</b></div><div><span>Necessidade</span><b>${fn(x.nec)}</b></div><div><span>Falta</span><b class="${x.falta?'falta':'ok'}">${x.falta?fn(x.falta):'OK'}</b></div>${base.cu?`<div><span>Custo unit. ref.</span><b>${brl(base.cu)}</b></div>`:''}</div>
    ${base.an?`<div class="minis" style="padding-top:12px;border-top:1px solid var(--line-2)"><div><span>Saldo inicial</span><b>${fn(base.an.i)}</b></div><div><span>Entradas</span><b>${fn(base.an.e)}</b></div><div><span>Saídas</span><b>${fn(base.an.sa)}</b></div><div><span>Saídas 90 dias</span><b>${fn(base.an.s90)}</b></div><div><span>Último movimento</span><b>${esc(base.an.ul||'–')}</b></div></div>`:''}
    ${(()=>{const st=situacao({i:ii});return st.k==='conf'?`<div class="help warn" style="margin-bottom:16px">${esc(st.msg)}</div>`:'';})()}
    ${x.grp?`<div style="margin:0 0 16px"><div style="font-size:12px;font-weight:600;color:var(--navy-900);margin-bottom:6px">Versões deste item (mesma descrição)</div><table><thead><tr><th>Cód.</th><th>Versão</th><th class="num">Saldo IAB</th><th class="num">Demanda (100%)</th><th class="num">Necessidade</th><th class="num">Falta (imprimir)</th><th class="num">Sobra</th></tr></thead><tbody>
      ${x.grp.slice().sort((a,b)=>b.c-a.c).map(m=>`<tr style="${m===x?'background:#EAF1FB':''}"><td class="cod">${m.c}</td><td><span class="vb ${m.ver}">${verTxt(m)}</span>${m.bruta>0?'':' <span class="vb fora">fora das propostas</span>'}</td><td class="num">${fn(m.s)}</td><td class="num">${m.bruta?fn(m.bruta):'–'}</td><td class="num">${m.nec?fn(m.nec):'–'}</td><td class="num ${m.falta?'falta':''}">${m.falta?fn(m.falta):'–'}</td><td class="num ${m.sobra?'ok':''}">${m.sobra?fn(m.sobra):'–'}</td></tr>`).join('')}
      </tbody></table></div>`:''}
    <table><thead><tr><th>Cliente</th><th>UF</th><th>Temperatura</th><th>Status</th><th>Kit</th><th class="num">Qtd. proposta</th><th class="num">Considerado</th></tr></thead><tbody>
    ${rows.map(r=>`<tr><td class="itn">${esc(r.p.cli)}</td><td>${esc(r.p.uf)}</td><td>${tb(r.p.t)}</td><td style="font-size:12px">${esc(r.p.stx)}</td><td style="font-size:12px;white-space:nowrap">${esc(r.kit)}</td><td class="num">${fn(r.q)}</td><td class="num">${fn(r.c)}</td></tr>`).join('')}
    </tbody></table></div></div>`);
}
function modalProp(pi){
  const p=D.props[pi]; const {it,lin}=calc(); const byI={}; it.forEach(x=>byI[x.i]=x);
  const rows=D.linhas.map((l,n)=>[l,n]).filter(([l])=>l[0]===pi).map(([[_,ii,q,kit],n])=>({x:D.itens[ii],c:byI[ii],q,kit,s:lin[n].s})).sort((a,b)=>b.q-a.q);
  const sem=rows.filter(r=>r.q>Math.max(0,r.x.s)).length;
  abrir(`<div class="modal"><div class="mhd"><div class="ic">${ICBOX}</div><div><h3>${esc(nomeCli(p))}</h3><div class="ms">${p.cons?`Tudo o que o IAB enviou em consignação: ${fn(p.cons.nfs)} notas de ${esc(p.cons.ini)} a ${esc(p.cons.fim)} · ${fn(p.cons.un)} un.${p.cons.trocas?` · ${p.cons.trocas} itens de versão antiga zerada somados na versão nova`:''}`:`${esc(p.id)} · ${esc(p.tipo)} · ${esc(p.stx)} · salva em ${esc(p.dt)}`}</div></div><button class="x" type="button" aria-label="Fechar">×</button></div><div class="mbd">
    <div class="minis"><div><span>Temperatura</span><b>${tb(p.t)}</b></div><div><span>Valor 26/27</span><b>${brl(p.v)}</b></div><div><span>Alunos</span><b>${fn(p.al)}</b></div><div><span>Linhas de itens</span><b>${fn(rows.length)}</b></div><div><span>Itens que o estoque não cobre sozinho</span><b class="${sem?'falta':'ok'}">${fn(sem)}</b></div></div>
    <table><thead><tr><th>Cód.</th><th>Item</th><th>Kit</th><th class="num">Qtd. proposta</th><th class="num">Já saiu</th><th class="num">Falta sair</th><th class="num">Saldo atual</th><th class="num">Falta no cenário (todos os clientes)</th></tr></thead><tbody>
    ${rows.map(r=>`<tr><td class="cod">${r.x.c}</td><td class="itn">${esc(r.x.d)}</td><td style="font-size:12px;white-space:nowrap">${esc(r.kit)}</td><td class="num">${fn(r.q)}</td><td class="num">${r.s?fn(r.s):'–'}</td><td class="num ${r.q-r.s>0?'':'ok'}">${r.q-r.s>0?fn(r.q-r.s):'✓'}</td><td class="num ${r.q-r.s>r.x.s?'falta':''}">${fn(r.x.s)}</td><td class="num ${r.c&&r.c.falta?'falta':'ok'}">${r.c&&r.c.falta?fn(r.c.falta):'OK'}</td></tr>`).join('')}
    </tbody></table></div></div>`);
}

/* ---------- início ---------- */
$('#baseTag').innerHTML=`Atualizado em <b>${esc(D.gerado)}</b><br>Estoque até ${esc(D.base_estoque)}`;
$('#sideFoot').innerHTML=`Logística IAB · Estimativa de Vendas<br>Fonte: CRM de Vendas + ERP`;
render();
</script>
